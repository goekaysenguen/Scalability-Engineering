services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=scalability
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api-1:
    build: 
      context: ./api
    environment:
      - REDIS_HOST=redis
      - DB_HOST=postgres
    depends_on: [redis, postgres]

  api-2:
    build: 
      context: ./api
    environment:
      - REDIS_HOST=redis
      - DB_HOST=postgres
    depends_on: [redis, postgres]

  worker:
    build: 
      context: ./worker
    environment:
      - REDIS_HOST=redis
      - DB_HOST=postgres
    depends_on: [redis, postgres]

  loadbalancer:
    image: nginx:1.31.1
    ports:
      - "8000:8000"
    volumes:
      - ./loadbalancer/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2