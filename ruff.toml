# ruff.toml

target-version = "py311"
line-length = 120

[lint]
select = [
    "E",   # pycodestyle errors (PEP 8 violations)
    "W",   # pycodestyle warnings (PEP 8 style warnings)
    "F",   # pyflakes (e.g., unused imports/variables)
    "I",   # isort (ensures proper import sorting)
    "B",   # flake8-bugbear (catches common bugs and anti-patterns)
    "C4",  # flake8-comprehensions (optimizes list/set/dict comprehensions)
    "UP",  # pyupgrade (enforces modern Python features)
    "SIM", # flake8-simplify (simplifies code, e.g., if-else statements)
]

ignore = [
    "E501",
    "B008",  # Important for FASTAPI
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"